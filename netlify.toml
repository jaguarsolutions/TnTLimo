# Netlify configuration for the TNT Tours Next.js app.
# The official Next.js runtime handles the App Router, API routes (Stripe,
# bookings, refunds) and Server Components as serverless / edge functions —
# no static export. Environment variables (DATABASE_URL, STRIPE_SECRET_KEY,
# RESEND_API_KEY, GOOGLE_MAPS_SERVER_KEY, NEXT_PUBLIC_* keys, etc.) are set in
# Netlify: Site configuration → Environment variables.

[build]
  command = "next build"
  # The Next.js runtime plugin manages the publish directory automatically.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Static asset caching ──────────────────────────────────────────────────────
# Images in /public have stable filenames, so let browsers and the Netlify CDN
# hold them for 30 days. This cuts repeat bandwidth from return visitors and
# crawlers re-fetching the same files (Next.js already sets immutable caching on
# hashed /_next/static assets, so those aren't repeated here).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/tnt-tours-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
