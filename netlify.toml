# Netlify configuration for the TNT Tours Next.js app.
# The official Next.js runtime handles the App Router, API routes (Stripe,
# bookings, refunds) and Server Components as serverless / edge functions —
# no static export. Environment variables (DATABASE_URL, STRIPE_SECRET_KEY,
# RESEND_API_KEY, GOOGLE_MAPS_SERVER_KEY, NEXT_PUBLIC_* keys, etc.) are set in
# Netlify: Site configuration → Environment variables.

[build]
  command = "next build"
  # The Next.js runtime plugin manages the publish directory automatically.
  publish = ".next"

[build.environment]
  # Netlify runs two secret scanners; both false-positive on our intentionally
  # public NEXT_PUBLIC_* keys (Next.js inlines every NEXT_PUBLIC_* var into the
  # browser bundle by design — they cannot be secret).
  #
  # 1. Explicit env scan — matches declared env-var VALUES in the build output.
  #    Omit the two public keys by name. The private GOOGLE_MAPS_SERVER_KEY,
  #    STRIPE_SECRET_KEY, DATABASE_URL, RESEND_API_KEY, etc. are NOT listed, so
  #    a real leak of those still fails the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY,NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY"
  #
  # 2. Smart detection — flags any string SHAPED like a secret (e.g. the Google
  #    "AIza…" browser-key pattern) regardless of env-var name. Its only hit is
  #    that public browser key, so we turn off the pattern layer. The explicit
  #    scan above still protects the real secrets. (The browser key is secured
  #    by HTTP-referrer restrictions in Google Cloud, not by being hidden.)
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Static asset caching ──────────────────────────────────────────────────────
# Images in /public have stable filenames, so let browsers and the Netlify CDN
# hold them for 30 days. This cuts repeat bandwidth from return visitors and
# crawlers re-fetching the same files (Next.js already sets immutable caching on
# hashed /_next/static assets, so those aren't repeated here).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/tnt-tours-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
